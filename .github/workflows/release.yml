name: release

on:
  push:
    tags: ["v*"]

permissions:
  # Create the GitHub release and upload its assets. Nothing else.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags so goreleaser can build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A tag can point at a commit CI never saw, so test before publishing.
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Same version .mise.toml pins, so a local `goreleaser check` and
          # snapshot build match what the release runs.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
