# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ature

# No `go mod tidy` before-hook: CI already fails on an untidy module, and a
# hook would rewrite go.mod after goreleaser checked the tree is clean.

builds:
  - main: .
    binary: ature
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible builds: strip local paths and stamp the commit's
    # timestamp rather than the build machine's.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # Prefixed with v so release binaries match the vX.Y.Z that go install
      # reports from the module version.
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
